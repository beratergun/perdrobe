<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc"><title id="title">PerDrobe proposed architecture</title><desc id="desc">The mobile client calls an authenticated API, which coordinates recommendation services and data stores. Versioned snapshots support offline evaluation. Arrows indicate the main processing sequence, not unrestricted data access.</desc><rect x="24" y="16" width="1452" height="150" fill="#f5f6f7" stroke="#737b83" stroke-width="2"/><text x="750" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Mobile client</text><text x="750" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Profile · wardrobe · discovery · recommendation requests</text><path d="M750 171 V211 m-9 -11 9 14 9 -14" fill="none" stroke="#333" stroke-width="3"/><rect x="24" y="218" width="1452" height="150" fill="#f5f6f7" stroke="#737b83" stroke-width="2"/><text x="750" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Backend API and access control</text><text x="750" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Validate requests · enforce ownership · record permitted interactions</text><path d="M750 373 V413 m-9 -11 9 14 9 -14" fill="none" stroke="#333" stroke-width="3"/><rect x="24" y="420" width="1452" height="150" fill="#f5f6f7" stroke="#737b83" stroke-width="2"/><text x="750" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Recommendation service</text><text x="750" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Features → candidates → compatibility and preference ranking</text><text x="750" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Size and fit estimation for supported products</text><path d="M750 575 V615 m-9 -11 9 14 9 -14" fill="none" stroke="#333" stroke-width="3"/><rect x="24" y="622" width="1452" height="150" fill="#f5f6f7" stroke="#737b83" stroke-width="2"/><text x="750" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Data stores</text><text x="750" y="707" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Profiles · wardrobe items · outfits · collections · interactions</text><text x="750" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Product catalogue · size charts · image storage</text><path d="M750 777 V817 m-9 -11 9 14 9 -14" fill="none" stroke="#333" stroke-width="3"/><rect x="24" y="824" width="1452" height="150" fill="#f5f6f7" stroke="#737b83" stroke-width="2"/><text x="750" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">Offline experiments</text><text x="750" y="909" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="400">Versioned data snapshots · configurations A B C · held-out evaluation</text></svg>